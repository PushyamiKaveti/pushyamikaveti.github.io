<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.data.site.title }}</title>
<meta name="description" content="{{ page.description | default: site.data.site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.data.site.base_styles_version }}">
{% if page.extra_styles %}
{% for style in page.extra_styles %}
<link rel="stylesheet" href="{{ style.path | relative_url }}?v={{ style.version }}">
{% endfor %}
{% endif %}
